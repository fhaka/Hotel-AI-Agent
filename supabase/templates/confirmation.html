<h2>Confirm your HotelAI account</h2>
<p>Thanks for signing up. Confirm your email address to activate your account:</p>
<!-- RedirectTo is the app's /auth/callback?next=... URL passed at sign-up (always has a query string). -->
<p><a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email">Confirm my email</a></p>
<p>If you didn't create a HotelAI account, you can ignore this email.</p>
