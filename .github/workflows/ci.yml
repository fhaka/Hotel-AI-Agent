name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Placeholders so the build can prerender; no real project is contacted.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_value
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # RLS / constraint tests against a throwaway PostgreSQL cluster
      # (ubuntu-latest ships PostgreSQL server binaries).
      - run: npm run test:db
      # Generated database types must match the migrations.
      - run: npm run db:types && git diff --exit-code src/lib/supabase/database.types.ts
      - run: npm run build
      # Every script on the public pages must be allowed by the CSP header.
      - name: Content Security Policy check
        run: |
          PORT=3100 npm start > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3100/ && break; sleep 1; done
          npm run check:csp -- http://localhost:3100
